apiVersion: v1
kind: Pod
metadata:
  name: secret-reader
  namespace: devops-lab
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
  containers:
    - name: reader
      image: devops-notes:1.0
      imagePullPolicy: IfNotPresent
      command: ["python", "-c", "import time; time.sleep(3600)"]
      volumeMounts:
        - name: secret
          mountPath: /run/lab-secret
          readOnly: true
  volumes:
    - name: secret
      secret:
        secretName: lab-secret
