name: veriqta-log-lab
services:
  app:
    build: .
    image: veriqta-log-lab:1.0
    ports: ["127.0.0.1:5000:8000"]
    logging:
      driver: local
      options: {max-size: "5m", max-file: "3"}
  proxy:
    image: nginx:1.28-alpine
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["./nginx/nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [app]
    logging:
      driver: local
      options: {max-size: "5m", max-file: "3"}
