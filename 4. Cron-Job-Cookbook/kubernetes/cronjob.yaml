apiVersion: v1
kind: Namespace
metadata:
  name: veriqta-cron
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: veriqta-backup
  namespace: veriqta-cron
spec:
  schedule: "0 2 * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 60
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
          containers:
            - name: backup
              image: alpine:3.22
              command:
                - /bin/sh
                - -ec
                - |
                  mkdir -p /work/source /work/restore
                  printf '%s\n' 'Veriqta configuration demonstration' > /work/source/app.conf
                  tar -czf /work/backup.tar.gz -C /work/source app.conf
                  tar -xzf /work/backup.tar.gz -C /work/restore
                  cmp /work/source/app.conf /work/restore/app.conf
                  printf '%s\n' 'Veriqta backup round trip verified'
              resources:
                requests: {cpu: 20m, memory: 16Mi}
                limits: {cpu: 100m, memory: 64Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              volumeMounts:
                - {name: work, mountPath: /work}
          volumes:
            - name: work
              emptyDir: {}
