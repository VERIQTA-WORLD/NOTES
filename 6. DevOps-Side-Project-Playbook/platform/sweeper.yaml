{
  "apiVersion": "v1",
  "kind": "List",
  "items": [
    {
      "apiVersion": "v1",
      "kind": "Namespace",
      "metadata": {
        "name": "veriqta-platform"
      }
    },
    {
      "apiVersion": "v1",
      "kind": "ServiceAccount",
      "metadata": {
        "name": "sweeper",
        "namespace": "veriqta-platform"
      }
    },
    {
      "apiVersion": "rbac.authorization.k8s.io/v1",
      "kind": "ClusterRole",
      "metadata": {
        "name": "veriqta-environment-sweeper"
      },
      "rules": [
        {
          "apiGroups": [
            ""
          ],
          "resources": [
            "namespaces"
          ],
          "verbs": [
            "get",
            "list",
            "delete"
          ]
        }
      ]
    },
    {
      "apiVersion": "rbac.authorization.k8s.io/v1",
      "kind": "ClusterRoleBinding",
      "metadata": {
        "name": "veriqta-environment-sweeper"
      },
      "roleRef": {
        "apiGroup": "rbac.authorization.k8s.io",
        "kind": "ClusterRole",
        "name": "veriqta-environment-sweeper"
      },
      "subjects": [
        {
          "kind": "ServiceAccount",
          "name": "sweeper",
          "namespace": "veriqta-platform"
        }
      ]
    },
    {
      "apiVersion": "batch/v1",
      "kind": "CronJob",
      "metadata": {
        "name": "expire-environments",
        "namespace": "veriqta-platform"
      },
      "spec": {
        "schedule": "*/5 * * * *",
        "concurrencyPolicy": "Forbid",
        "successfulJobsHistoryLimit": 1,
        "failedJobsHistoryLimit": 2,
        "jobTemplate": {
          "spec": {
            "activeDeadlineSeconds": 120,
            "backoffLimit": 1,
            "template": {
              "spec": {
                "serviceAccountName": "sweeper",
                "restartPolicy": "Never",
                "containers": [
                  {
                    "name": "sweep",
                    "image": "veriqta-platform:lab",
                    "imagePullPolicy": "IfNotPresent",
                    "args": [
                      "sweep",
                      "--apply"
                    ],
                    "resources": {
                      "requests": {
                        "cpu": "25m",
                        "memory": "32Mi"
                      },
                      "limits": {
                        "cpu": "200m",
                        "memory": "128Mi"
                      }
                    }
                  }
                ]
              }
            }
          }
        }
      }
    }
  ]
}
