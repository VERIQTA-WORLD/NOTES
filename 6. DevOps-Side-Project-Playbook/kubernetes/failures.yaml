{
  "apiVersion": "v1",
  "kind": "List",
  "items": [
    {
      "apiVersion": "v1",
      "kind": "Namespace",
      "metadata": {
        "name": "veriqta-failures"
      }
    },
    {
      "apiVersion": "apps/v1",
      "kind": "Deployment",
      "metadata": {
        "name": "db",
        "namespace": "veriqta-failures"
      },
      "spec": {
        "replicas": 1,
        "strategy": {
          "type": "Recreate"
        },
        "selector": {
          "matchLabels": {
            "app": "db"
          }
        },
        "template": {
          "metadata": {
            "labels": {
              "app": "db"
            }
          },
          "spec": {
            "containers": [
              {
                "name": "db",
                "image": "postgres:17-bookworm",
                "env": [
                  {
                    "name": "POSTGRES_DB",
                    "value": "veriqta"
                  },
                  {
                    "name": "POSTGRES_USER",
                    "value": "veriqta"
                  },
                  {
                    "name": "POSTGRES_PASSWORD",
                    "valueFrom": {
                      "secretKeyRef": {
                        "name": "database",
                        "key": "password"
                      }
                    }
                  }
                ],
                "ports": [
                  {
                    "containerPort": 5432
                  }
                ],
                "volumeMounts": [
                  {
                    "name": "data",
                    "mountPath": "/var/lib/postgresql/data"
                  }
                ],
                "resources": {
                  "requests": {
                    "cpu": "100m",
                    "memory": "128Mi"
                  },
                  "limits": {
                    "cpu": "1",
                    "memory": "512Mi"
                  }
                },
                "readinessProbe": {
                  "exec": {
                    "command": [
                      "pg_isready",
                      "-U",
                      "veriqta"
                    ]
                  },
                  "periodSeconds": 5
                }
              }
            ],
            "volumes": [
              {
                "name": "data",
                "emptyDir": {}
              }
            ]
          }
        }
      }
    },
    {
      "apiVersion": "v1",
      "kind": "Service",
      "metadata": {
        "name": "db",
        "namespace": "veriqta-failures"
      },
      "spec": {
        "selector": {
          "app": "db"
        },
        "ports": [
          {
            "port": 5432
          }
        ]
      }
    },
    {
      "apiVersion": "apps/v1",
      "kind": "Deployment",
      "metadata": {
        "name": "api",
        "namespace": "veriqta-failures"
      },
      "spec": {
        "replicas": 1,
        "selector": {
          "matchLabels": {
            "component": "api"
          }
        },
        "template": {
          "metadata": {
            "labels": {
              "app": "api",
              "version": "v1",
              "component": "api"
            }
          },
          "spec": {
            "automountServiceAccountToken": false,
            "containers": [
              {
                "name": "api",
                "image": "veriqta-api:lab",
                "imagePullPolicy": "IfNotPresent",
                "ports": [
                  {
                    "containerPort": 8080
                  }
                ],
                "env": [
                  {
                    "name": "VERSION",
                    "value": "v1"
                  },
                  {
                    "name": "DB_HOST",
                    "value": "db"
                  },
                  {
                    "name": "DB_NAME",
                    "value": "veriqta"
                  },
                  {
                    "name": "DB_USER",
                    "value": "veriqta"
                  },
                  {
                    "name": "DB_PASSWORD",
                    "valueFrom": {
                      "secretKeyRef": {
                        "name": "database",
                        "key": "password"
                      }
                    }
                  }
                ],
                "resources": {
                  "requests": {
                    "cpu": "50m",
                    "memory": "64Mi"
                  },
                  "limits": {
                    "cpu": "500m",
                    "memory": "256Mi"
                  }
                },
                "readinessProbe": {
                  "httpGet": {
                    "path": "/readyz",
                    "port": 8080
                  },
                  "periodSeconds": 3
                },
                "livenessProbe": {
                  "httpGet": {
                    "path": "/healthz",
                    "port": 8080
                  },
                  "periodSeconds": 10
                },
                "securityContext": {
                  "runAsNonRoot": true,
                  "runAsUser": 10001,
                  "allowPrivilegeEscalation": false,
                  "capabilities": {
                    "drop": [
                      "ALL"
                    ]
                  },
                  "seccompProfile": {
                    "type": "RuntimeDefault"
                  }
                }
              }
            ]
          }
        }
      }
    },
    {
      "apiVersion": "v1",
      "kind": "Service",
      "metadata": {
        "name": "api",
        "namespace": "veriqta-failures"
      },
      "spec": {
        "selector": {
          "component": "api"
        },
        "ports": [
          {
            "port": 8080
          }
        ]
      }
    },
    {
      "apiVersion": "v1",
      "kind": "ConfigMap",
      "metadata": {
        "name": "web",
        "namespace": "veriqta-failures"
      },
      "data": {
        "default.conf": "server { listen 80; location / { proxy_pass http://api:8080; } }\n"
      }
    },
    {
      "apiVersion": "apps/v1",
      "kind": "Deployment",
      "metadata": {
        "name": "web",
        "namespace": "veriqta-failures"
      },
      "spec": {
        "selector": {
          "matchLabels": {
            "app": "web"
          }
        },
        "template": {
          "metadata": {
            "labels": {
              "app": "web"
            }
          },
          "spec": {
            "containers": [
              {
                "name": "web",
                "image": "nginx:1.28-alpine",
                "ports": [
                  {
                    "containerPort": 80
                  }
                ],
                "volumeMounts": [
                  {
                    "name": "config",
                    "mountPath": "/etc/nginx/conf.d"
                  }
                ],
                "resources": {
                  "requests": {
                    "cpu": "25m",
                    "memory": "32Mi"
                  },
                  "limits": {
                    "cpu": "200m",
                    "memory": "128Mi"
                  }
                }
              }
            ],
            "volumes": [
              {
                "name": "config",
                "configMap": {
                  "name": "web"
                }
              }
            ]
          }
        }
      }
    },
    {
      "apiVersion": "v1",
      "kind": "Service",
      "metadata": {
        "name": "web",
        "namespace": "veriqta-failures"
      },
      "spec": {
        "selector": {
          "app": "web"
        },
        "ports": [
          {
            "port": 80
          }
        ]
      }
    }
  ]
}
