{
  "apiVersion": "v1",
  "kind": "List",
  "items": [
    {
      "apiVersion": "v1",
      "kind": "ConfigMap",
      "metadata": {
        "name": "fluent-bit",
        "namespace": "veriqta-incident"
      },
      "data": {
        "fluent-bit.conf": "[SERVICE]\n    Flush 1\n    Log_Level info\n[INPUT]\n    Name tail\n    Path /var/log/containers/*_veriqta-incident_*.log\n    Tag kube.veriqta\n    multiline.parser docker, cri\n    Read_from_Head true\n[OUTPUT]\n    Name stdout\n    Match *\n    Format json_lines\n"
      }
    },
    {
      "apiVersion": "apps/v1",
      "kind": "DaemonSet",
      "metadata": {
        "name": "fluent-bit",
        "namespace": "veriqta-incident"
      },
      "spec": {
        "selector": {
          "matchLabels": {
            "app": "fluent-bit"
          }
        },
        "template": {
          "metadata": {
            "labels": {
              "app": "fluent-bit"
            }
          },
          "spec": {
            "automountServiceAccountToken": false,
            "tolerations": [
              {
                "operator": "Exists"
              }
            ],
            "containers": [
              {
                "name": "fluent-bit",
                "image": "cr.fluentbit.io/fluent/fluent-bit:4.0.7",
                "args": [
                  "-c",
                  "/config/fluent-bit.conf"
                ],
                "securityContext": {
                  "runAsUser": 0,
                  "readOnlyRootFilesystem": true,
                  "allowPrivilegeEscalation": false
                },
                "resources": {
                  "requests": {
                    "cpu": "25m",
                    "memory": "32Mi"
                  },
                  "limits": {
                    "cpu": "200m",
                    "memory": "128Mi"
                  }
                },
                "volumeMounts": [
                  {
                    "name": "logs",
                    "mountPath": "/var/log",
                    "readOnly": true
                  },
                  {
                    "name": "config",
                    "mountPath": "/config",
                    "readOnly": true
                  }
                ]
              }
            ],
            "volumes": [
              {
                "name": "logs",
                "hostPath": {
                  "path": "/var/log",
                  "type": "Directory"
                }
              },
              {
                "name": "config",
                "configMap": {
                  "name": "fluent-bit"
                }
              }
            ]
          }
        }
      }
    }
  ]
}
