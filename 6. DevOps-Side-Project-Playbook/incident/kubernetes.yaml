{
  "apiVersion": "v1",
  "kind": "List",
  "items": [
    {
      "apiVersion": "v1",
      "kind": "Namespace",
      "metadata": {
        "name": "veriqta-incident"
      }
    },
    {
      "apiVersion": "apps/v1",
      "kind": "Deployment",
      "metadata": {
        "name": "db",
        "namespace": "veriqta-incident"
      },
      "spec": {
        "replicas": 1,
        "strategy": {
          "type": "Recreate"
        },
        "selector": {
          "matchLabels": {
            "app": "db"
          }
        },
        "template": {
          "metadata": {
            "labels": {
              "app": "db"
            }
          },
          "spec": {
            "containers": [
              {
                "name": "db",
                "image": "postgres:17-bookworm",
                "env": [
                  {
                    "name": "POSTGRES_DB",
                    "value": "veriqta"
                  },
                  {
                    "name": "POSTGRES_USER",
                    "value": "veriqta"
                  },
                  {
                    "name": "POSTGRES_PASSWORD",
                    "valueFrom": {
                      "secretKeyRef": {
                        "name": "database",
                        "key": "password"
                      }
                    }
                  }
                ],
                "ports": [
                  {
                    "containerPort": 5432
                  }
                ],
                "volumeMounts": [
                  {
                    "name": "data",
                    "mountPath": "/var/lib/postgresql/data"
                  }
                ],
                "resources": {
                  "requests": {
                    "cpu": "100m",
                    "memory": "128Mi"
                  },
                  "limits": {
                    "cpu": "1",
                    "memory": "512Mi"
                  }
                },
                "readinessProbe": {
                  "exec": {
                    "command": [
                      "pg_isready",
                      "-U",
                      "veriqta"
                    ]
                  },
                  "periodSeconds": 5
                }
              }
            ],
            "volumes": [
              {
                "name": "data",
                "persistentVolumeClaim": {
                  "claimName": "db-data"
                }
              }
            ]
          }
        }
      }
    },
    {
      "apiVersion": "v1",
      "kind": "Service",
      "metadata": {
        "name": "db",
        "namespace": "veriqta-incident"
      },
      "spec": {
        "selector": {
          "app": "db"
        },
        "ports": [
          {
            "port": 5432
          }
        ]
      }
    },
    {
      "apiVersion": "apps/v1",
      "kind": "Deployment",
      "metadata": {
        "name": "api",
        "namespace": "veriqta-incident"
      },
      "spec": {
        "replicas": 1,
        "selector": {
          "matchLabels": {
            "component": "api"
          }
        },
        "template": {
          "metadata": {
            "labels": {
              "app": "api",
              "version": "v1",
              "component": "api"
            }
          },
          "spec": {
            "automountServiceAccountToken": false,
            "containers": [
              {
                "name": "api",
                "image": "veriqta-api:lab",
                "imagePullPolicy": "IfNotPresent",
                "ports": [
                  {
                    "containerPort": 8080
                  }
                ],
                "env": [
                  {
                    "name": "VERSION",
                    "value": "v1"
                  },
                  {
                    "name": "DB_HOST",
                    "value": "db"
                  },
                  {
                    "name": "DB_NAME",
                    "value": "veriqta"
                  },
                  {
                    "name": "DB_USER",
                    "value": "veriqta"
                  },
                  {
                    "name": "DB_PASSWORD",
                    "valueFrom": {
                      "secretKeyRef": {
                        "name": "database",
                        "key": "password"
                      }
                    }
                  },
                  {
                    "name": "POOL_SIZE",
                    "value": "8"
                  },
                  {
                    "name": "DB_HOLD",
                    "value": ".01"
                  },
                  {
                    "name": "DB_RETRIES",
                    "value": "0"
                  },
                  {
                    "name": "OTEL_EXPORTER_OTLP_ENDPOINT",
                    "value": "http://collector:4317"
                  },
                  {
                    "name": "OTEL_EXPORTER_OTLP_INSECURE",
                    "value": "true"
                  }
                ],
                "resources": {
                  "requests": {
                    "cpu": "50m",
                    "memory": "64Mi"
                  },
                  "limits": {
                    "cpu": "500m",
                    "memory": "256Mi"
                  }
                },
                "readinessProbe": {
                  "httpGet": {
                    "path": "/readyz",
                    "port": 8080
                  },
                  "periodSeconds": 3
                },
                "livenessProbe": {
                  "httpGet": {
                    "path": "/healthz",
                    "port": 8080
                  },
                  "periodSeconds": 10
                },
                "securityContext": {
                  "runAsNonRoot": true,
                  "runAsUser": 10001,
                  "allowPrivilegeEscalation": false,
                  "capabilities": {
                    "drop": [
                      "ALL"
                    ]
                  },
                  "seccompProfile": {
                    "type": "RuntimeDefault"
                  }
                }
              }
            ]
          }
        }
      }
    },
    {
      "apiVersion": "v1",
      "kind": "Service",
      "metadata": {
        "name": "api",
        "namespace": "veriqta-incident"
      },
      "spec": {
        "selector": {
          "component": "api"
        },
        "ports": [
          {
            "port": 8080
          }
        ]
      }
    },
    {
      "apiVersion": "v1",
      "kind": "ConfigMap",
      "metadata": {
        "name": "web",
        "namespace": "veriqta-incident"
      },
      "data": {
        "default.conf": "server { listen 80; location / { proxy_pass http://api:8080; } }\n"
      }
    },
    {
      "apiVersion": "apps/v1",
      "kind": "Deployment",
      "metadata": {
        "name": "web",
        "namespace": "veriqta-incident"
      },
      "spec": {
        "selector": {
          "matchLabels": {
            "app": "web"
          }
        },
        "template": {
          "metadata": {
            "labels": {
              "app": "web"
            }
          },
          "spec": {
            "containers": [
              {
                "name": "web",
                "image": "nginx:1.28-alpine",
                "ports": [
                  {
                    "containerPort": 80
                  }
                ],
                "volumeMounts": [
                  {
                    "name": "config",
                    "mountPath": "/etc/nginx/conf.d"
                  }
                ],
                "resources": {
                  "requests": {
                    "cpu": "25m",
                    "memory": "32Mi"
                  },
                  "limits": {
                    "cpu": "200m",
                    "memory": "128Mi"
                  }
                }
              }
            ],
            "volumes": [
              {
                "name": "config",
                "configMap": {
                  "name": "web"
                }
              }
            ]
          }
        }
      }
    },
    {
      "apiVersion": "v1",
      "kind": "Service",
      "metadata": {
        "name": "web",
        "namespace": "veriqta-incident"
      },
      "spec": {
        "selector": {
          "app": "web"
        },
        "ports": [
          {
            "port": 80
          }
        ]
      }
    },
    {
      "apiVersion": "v1",
      "kind": "PersistentVolumeClaim",
      "metadata": {
        "name": "db-data",
        "namespace": "veriqta-incident"
      },
      "spec": {
        "accessModes": [
          "ReadWriteOnce"
        ],
        "resources": {
          "requests": {
            "storage": "1Gi"
          }
        }
      }
    },
    {
      "apiVersion": "v1",
      "kind": "PersistentVolumeClaim",
      "metadata": {
        "name": "traces",
        "namespace": "veriqta-incident"
      },
      "spec": {
        "accessModes": [
          "ReadWriteOnce"
        ],
        "resources": {
          "requests": {
            "storage": "1Gi"
          }
        }
      }
    },
    {
      "apiVersion": "v1",
      "kind": "ConfigMap",
      "metadata": {
        "name": "collector",
        "namespace": "veriqta-incident"
      },
      "data": {
        "config.yaml": "receivers:\n  otlp:\n    protocols:\n      grpc: {endpoint: '0.0.0.0:4317'}\nprocessors:\n  batch: {timeout: 1s}\nexporters:\n  file: {path: /data/traces.jsonl}\nservice:\n  pipelines:\n    traces:\n      receivers: [otlp]\n      processors: [batch]\n      exporters: [file]\n"
      }
    },
    {
      "apiVersion": "apps/v1",
      "kind": "Deployment",
      "metadata": {
        "name": "collector",
        "namespace": "veriqta-incident"
      },
      "spec": {
        "replicas": 1,
        "strategy": {
          "type": "Recreate"
        },
        "selector": {
          "matchLabels": {
            "app": "collector"
          }
        },
        "template": {
          "metadata": {
            "labels": {
              "app": "collector"
            }
          },
          "spec": {
            "securityContext": {
              "runAsUser": 10001,
              "runAsGroup": 10001,
              "fsGroup": 10001
            },
            "automountServiceAccountToken": false,
            "containers": [
              {
                "name": "collector",
                "image": "otel/opentelemetry-collector-contrib:0.130.1",
                "args": [
                  "--config=/config/config.yaml"
                ],
                "volumeMounts": [
                  {
                    "name": "config",
                    "mountPath": "/config"
                  },
                  {
                    "name": "data",
                    "mountPath": "/data"
                  }
                ],
                "ports": [
                  {
                    "containerPort": 4317
                  }
                ]
              }
            ],
            "volumes": [
              {
                "name": "config",
                "configMap": {
                  "name": "collector"
                }
              },
              {
                "name": "data",
                "persistentVolumeClaim": {
                  "claimName": "traces"
                }
              }
            ]
          }
        }
      }
    },
    {
      "apiVersion": "v1",
      "kind": "Service",
      "metadata": {
        "name": "collector",
        "namespace": "veriqta-incident"
      },
      "spec": {
        "selector": {
          "app": "collector"
        },
        "ports": [
          {
            "port": 4317
          }
        ]
      }
    },
    {
      "apiVersion": "v1",
      "kind": "Pod",
      "metadata": {
        "name": "trace-reader",
        "namespace": "veriqta-incident"
      },
      "spec": {
        "automountServiceAccountToken": false,
        "restartPolicy": "Never",
        "securityContext": {
          "runAsUser": 10001,
          "runAsGroup": 10001,
          "fsGroup": 10001
        },
        "containers": [
          {
            "name": "reader",
            "image": "python:3.12-slim-bookworm",
            "command": [
              "sleep",
              "infinity"
            ],
            "volumeMounts": [
              {
                "name": "data",
                "mountPath": "/data",
                "readOnly": true
              }
            ]
          }
        ],
        "volumes": [
          {
            "name": "data",
            "persistentVolumeClaim": {
              "claimName": "traces"
            }
          }
        ]
      }
    }
  ]
}
