{
  "apiVersion": "v1",
  "kind": "List",
  "items": [
    {
      "apiVersion": "v1",
      "kind": "Namespace",
      "metadata": {
        "name": "veriqta-release"
      }
    },
    {
      "apiVersion": "apps/v1",
      "kind": "Deployment",
      "metadata": {
        "name": "stable",
        "namespace": "veriqta-release"
      },
      "spec": {
        "replicas": 3,
        "selector": {
          "matchLabels": {
            "component": "stable"
          }
        },
        "template": {
          "metadata": {
            "labels": {
              "app": "api",
              "version": "v1",
              "component": "stable"
            }
          },
          "spec": {
            "automountServiceAccountToken": false,
            "containers": [
              {
                "name": "api",
                "image": "veriqta-api:lab",
                "imagePullPolicy": "IfNotPresent",
                "ports": [
                  {
                    "containerPort": 8080
                  }
                ],
                "env": [
                  {
                    "name": "VERSION",
                    "value": "v1"
                  }
                ],
                "resources": {
                  "requests": {
                    "cpu": "50m",
                    "memory": "64Mi"
                  },
                  "limits": {
                    "cpu": "500m",
                    "memory": "256Mi"
                  }
                },
                "readinessProbe": {
                  "httpGet": {
                    "path": "/readyz",
                    "port": 8080
                  },
                  "periodSeconds": 3
                },
                "livenessProbe": {
                  "httpGet": {
                    "path": "/healthz",
                    "port": 8080
                  },
                  "periodSeconds": 10
                },
                "securityContext": {
                  "runAsNonRoot": true,
                  "runAsUser": 10001,
                  "allowPrivilegeEscalation": false,
                  "capabilities": {
                    "drop": [
                      "ALL"
                    ]
                  },
                  "seccompProfile": {
                    "type": "RuntimeDefault"
                  }
                }
              }
            ]
          }
        }
      }
    },
    {
      "apiVersion": "apps/v1",
      "kind": "Deployment",
      "metadata": {
        "name": "canary",
        "namespace": "veriqta-release"
      },
      "spec": {
        "replicas": 1,
        "selector": {
          "matchLabels": {
            "component": "canary"
          }
        },
        "template": {
          "metadata": {
            "labels": {
              "app": "api",
              "version": "v2",
              "component": "canary"
            }
          },
          "spec": {
            "automountServiceAccountToken": false,
            "containers": [
              {
                "name": "api",
                "image": "veriqta-api:lab",
                "imagePullPolicy": "IfNotPresent",
                "ports": [
                  {
                    "containerPort": 8080
                  }
                ],
                "env": [
                  {
                    "name": "VERSION",
                    "value": "v2"
                  },
                  {
                    "name": "ERROR_EVERY",
                    "value": "5"
                  }
                ],
                "resources": {
                  "requests": {
                    "cpu": "50m",
                    "memory": "64Mi"
                  },
                  "limits": {
                    "cpu": "500m",
                    "memory": "256Mi"
                  }
                },
                "readinessProbe": {
                  "httpGet": {
                    "path": "/readyz",
                    "port": 8080
                  },
                  "periodSeconds": 3
                },
                "livenessProbe": {
                  "httpGet": {
                    "path": "/healthz",
                    "port": 8080
                  },
                  "periodSeconds": 10
                },
                "securityContext": {
                  "runAsNonRoot": true,
                  "runAsUser": 10001,
                  "allowPrivilegeEscalation": false,
                  "capabilities": {
                    "drop": [
                      "ALL"
                    ]
                  },
                  "seccompProfile": {
                    "type": "RuntimeDefault"
                  }
                }
              }
            ]
          }
        }
      }
    },
    {
      "apiVersion": "v1",
      "kind": "Service",
      "metadata": {
        "name": "api",
        "namespace": "veriqta-release"
      },
      "spec": {
        "selector": {
          "app": "api"
        },
        "ports": [
          {
            "port": 8080,
            "targetPort": 8080
          }
        ]
      }
    },
    {
      "apiVersion": "v1",
      "kind": "Service",
      "metadata": {
        "name": "stable",
        "namespace": "veriqta-release"
      },
      "spec": {
        "selector": {
          "component": "stable"
        },
        "ports": [
          {
            "port": 8080,
            "targetPort": 8080
          }
        ]
      }
    },
    {
      "apiVersion": "v1",
      "kind": "Service",
      "metadata": {
        "name": "canary",
        "namespace": "veriqta-release"
      },
      "spec": {
        "selector": {
          "component": "canary"
        },
        "ports": [
          {
            "port": 8080,
            "targetPort": 8080
          }
        ]
      }
    }
  ]
}
