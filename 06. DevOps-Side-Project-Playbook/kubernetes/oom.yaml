{
  "apiVersion": "v1",
  "kind": "Pod",
  "metadata": {
    "name": "oom",
    "namespace": "veriqta-failures"
  },
  "spec": {
    "restartPolicy": "Never",
    "containers": [
      {
        "name": "allocate",
        "image": "python:3.12-slim-bookworm",
        "command": [
          "python",
          "-c",
          "import time; blocks=[]\nwhile True:\n blocks.append(bytearray(8*1024*1024)); time.sleep(.1)"
        ],
        "resources": {
          "requests": {
            "memory": "16Mi",
            "cpu": "10m"
          },
          "limits": {
            "memory": "32Mi",
            "cpu": "100m"
          }
        }
      }
    ]
  }
}
