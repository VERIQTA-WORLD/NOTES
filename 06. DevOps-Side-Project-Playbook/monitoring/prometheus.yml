global:
  scrape_interval: 5s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/rules.yml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["stable:8080"]
        labels: {track: stable}
      - targets: ["canary:8080"]
        labels: {track: canary}
